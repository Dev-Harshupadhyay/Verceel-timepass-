<!doctype html>
<html lang="en" data-theme="apple-light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Timepass Premium | Official</title>
    <meta
      name="description"
      content="TIMEPASS PREMIUM — Market se sasta OTT. Movies & Web Series, Adult aur Combo plans. Instant UPI payment aur fast verification."
    />
    <meta name="theme-color" id="themeColorMeta" content="#ffffff" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/logo.svg" />
    <link rel="mask-icon" href="/logo.svg" color="#d4af37" />
    <link rel="canonical" href="https://timepass.premium/" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="TIMEPASS PREMIUM | Official" />

      property="og:description"
      content="Market se sasta OTT — Movies, Web Series, Adult aur Combo plans. Instant UPI payment, fast verification."
    />
    <meta property="og:image" content="/logo.svg" />
    <meta name="twitter:card" content="summary" />

    <!-- Apply the saved theme before first paint (zero flash / FOUC). -->
    <script>
      (function () {
        var VALID = ["apple-light", "obsidian", "violet-dark", "amethyst", "cyber", "crimson", "emerald", "pearl"];
        var DARK = ["obsidian", "violet-dark", "amethyst", "cyber", "crimson", "emerald"];
        var META = {
          "apple-light": "#ffffff", obsidian: "#07060a", "violet-dark": "#0b0b10", amethyst: "#08060e",
          cyber: "#04080c", crimson: "#0a0406", emerald: "#040907", pearl: "#f7f4ed"
        };
        var t = null;
        try { t = localStorage.getItem("tp_theme"); } catch (e) {}
        if (VALID.indexOf(t) === -1) t = "apple-light";
        var root = document.documentElement;
        root.setAttribute("data-theme", t);
        root.style.colorScheme = DARK.indexOf(t) === -1 ? "light" : "dark";
        var meta = document.getElementById("themeColorMeta");
        if (meta) meta.setAttribute("content", META[t] || "#ffffff");
      })();
    </script>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;800;900&family=Inter:wght@400;500;600;700;800;900&family=Space+Mono:wght@700&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />
  </head>
  <body>
    <div id="root"></div>

    <script type="module" src="/src/main.tsx"></script>

</html>
